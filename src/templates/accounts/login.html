{% extends "base.html" %}

{% block title %}Sign In - Electronics Store Inventory{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card" style="padding: 2rem;">
        <h2 style="margin-bottom: 0.5rem; color: var(--primary);">Sign In</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Electronics Store Inventory Management System
        </p>

        {% if form.errors %}
            <div class="alert alert-error" role="alert" id="login-error">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div style="margin-bottom: 1.25rem;">
                <label for="id_username" style="display: block; margin-bottom: 0.35rem; font-weight: 500; font-size: 0.9rem;">Username</label>
                <input type="text" name="username" autofocus required autocomplete="username" aria-describedby="{% if form.errors %}login-error{% endif %}" id="id_username"
                       style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="id_password" style="display: block; margin-bottom: 0.35rem; font-weight: 500; font-size: 0.9rem;">Password</label>
                <input type="password" name="password" required autocomplete="current-password" aria-describedby="{% if form.errors %}login-error{% endif %}" id="id_password"
                       style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem; font-size: 1rem;">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
